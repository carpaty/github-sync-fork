name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          check-latest: true
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npm install -g vsce
      - run: vsce package
      - run: ls -la
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VSCE_PAT: ${{ secrets.VS_TOKEN }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CARPATY_ACTION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true
      - run: git config --global user.email "lip@lip.net.ua"
      - run: git config --global user.name "aspel"
      - run: npm version patch -m "Update to [%s] [ci skip]"
      - run: npm install
      - run: xvfb-run -a npm test
      - run: npm install -g vsce
      - run: vsce package
      - run: vsce publish --skip-duplicate
      - run: git push
